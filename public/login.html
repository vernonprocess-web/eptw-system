<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ePTW System — Central Authentication Gateway</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#f8fafc">
  <link rel="stylesheet" href="assets/css/theme.css?v=8">
  <style>
    body {
      background: #f8fafc;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .login-gateway-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      text-align: center;
    }
    .brand-logo {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }
    .brand-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
    }
    .brand-subtitle {
      font-size: 0.82rem;
      color: #64748b;
      margin-bottom: 24px;
    }
    .form-group-login {
      text-align: left;
      margin-bottom: 16px;
    }
    .form-group-login label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 6px;
    }
    .login-select, .login-input {
      width: 100%;
      padding: 12px 14px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #1f2937;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .pin-input {
      letter-spacing: 0.35em;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .login-select:focus, .login-input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    .btn-login-gateway {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      margin-top: 12px;
      transition: background-color 0.15s, transform 0.1s;
    }
    .btn-login-gateway:hover {
      background: #1d4ed8;
    }
    .btn-login-gateway:active {
      transform: scale(0.98);
    }
    .btn-login-gateway:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .routing-preview-badge {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.78rem;
      color: #1e40af;
      margin-top: 8px;
      text-align: left;
      line-height: 1.4;
    }
    .login-error-banner {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.84rem;
      font-weight: 600;
      margin-top: 12px;
      text-align: left;
    }
    .login-footer-note {
      margin-top: 18px;
      font-size: 0.75rem;
      color: #64748b;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="login-gateway-card">
    <div class="brand-logo">🛡️</div>
    <div class="brand-title">ePTW Safety Gateway</div>
    <div class="brand-subtitle">Singapore MOM WSH Compliance &amp; Site Access</div>

    <form id="loginGatewayForm" autocomplete="off">
      <div class="form-group-login">
        <label for="userProfileSelect">Select Your Account</label>
        <select id="userProfileSelect" class="login-select" required>
          <option value="">Loading active accounts...</option>
        </select>
      </div>

      <div class="form-group-login">
        <label for="pinInput">6-Digit Access PIN</label>
        <input
          id="pinInput"
          type="password"
          inputmode="numeric"
          pattern="[0-9]{6}"
          maxlength="6"
          class="login-input pin-input"
          placeholder="••••••"
          autocomplete="one-time-code"
          required
        >
      </div>

      <div id="routingPreview" class="routing-preview-badge">
        Select your account and enter the 6-digit PIN issued by HQ.
      </div>

      <div id="loginError" class="login-error-banner" role="alert"></div>

      <button type="submit" id="loginSubmitBtn" class="btn-login-gateway">
        Unlock &amp; Enter Portal
      </button>
    </form>

    <div class="login-footer-note">
      Sessions remain active on this device for 30 days.<br>
      Need a PIN or reset? Contact HQ Admin.
    </div>
  </div>

  <script type="module" src="assets/js/login.js?v=2"></script>
</body>
</html>
